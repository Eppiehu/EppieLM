model:
  # 模型名称
  name: EppieLM-150M

  # 直接复用 SpongeBob tokenizer 的 15K 词表
  vocab_size: 15000

  # Transformer 主干
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 22

  # GQA：12 个 Query heads，共享 4 个 KV heads
  num_attention_heads: 12
  num_key_value_heads: 4

  # 模型架构最大支持 8K context
  max_position_embeddings: 8192

  # RMSNorm
  rms_norm_eps: 1.0e-6

  # 标准 RoPE baseline
  rope_theta: 10000.0

  # 第一版预训练不使用 dropout
  attention_dropout: 0.0
  hidden_dropout: 0.0

  # 权重初始化
  initializer_range: 0.02

  # 默认训练路径使用 PyTorch SDPA
  # eager 保留作为数值正确性的 reference implementation
  attention_impl: sdpa

  # 推理支持 KV Cache
  use_cache: true

  # Token Embedding 和 LM Head 共享权重
  tie_word_embeddings: true

  # 与复用的 SpongeBob tokenizer 保持一致
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0


tokenizer:
  # 不重新训练 tokenizer，直接复用已有 ByteLevel BPE
  path: tokenizer/eppielm_tokenizer

  vocab_size: 15000
  model_max_length: 8192


data:
  train_path: null
  validation_path: null

  # 第一阶段预训练主要采用 2K 序列
  # 模型本身仍然支持最高 8K
  sequence_length: 2048

  num_workers: 4
  pin_memory: true

  shuffle_buffer_size: 10000

  seed: 42


training:
  output_dir: outputs/eppielm_150m

  seed: 42

  # RTX 50 系 GPU 后续实际 smoke test 再确认最佳精度和 batch
  precision: bf16

  micro_batch_size: 2
  gradient_accumulation_steps: 16

  # AdamW
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5

  weight_decay: 0.1

  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8

  # 防止训练早期梯度爆炸
  max_grad_norm: 1.0

  warmup_steps: 2000

  # 正式训练前会根据总训练 token 数重新确定
  max_steps: 100000

  scheduler: cosine

  # 用计算换显存
  gradient_checkpointing: true

  # baseline 稳定后再做 compile benchmark
  compile: false


checkpoint:
  save_steps: 1000

  save_total_limit: 3

  resume_from_checkpoint: null

  save_optimizer: true
  save_scheduler: true


evaluation:
  eval_steps: 500

  max_eval_batches: 100

  compute_perplexity: true


logging:
  log_steps: 10

  report_to: tensorboard

  run_name: eppielm-150m-pretrain


generation:
  max_new_tokens: 256

  temperature: 0.8
  top_p: 0.95
  top_k: 50

  do_sample: true